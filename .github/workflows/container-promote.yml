name: Promote Production Image

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  promote:
    name: Promote tested image without rebuilding
    if: >
      github.event.pull_request.merged == true &&
      (github.event.pull_request.head.ref == 'develop' ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release
        id: release
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="v$(TZ=Asia/Shanghai date +'%Y.%m.%d.%H%M%S')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tested source image exists
        shell: bash
        run: |
          docker buildx imagetools inspect             "${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.source_sha }}"

      - name: Promote exact tested image
        shell: bash
        run: |
          docker buildx imagetools create             --tag "${{ steps.release.outputs.image }}:stable"             --tag "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}"             "${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.source_sha }}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.version }}"             --repo "${{ github.repository }}"             --target "${{ steps.release.outputs.merge_sha }}"             --title "${{ steps.release.outputs.version }}"             --notes "Promoted tested image \`${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.source_sha }}\` to \`stable\`. Production must deploy this promoted image; do not rebuild it on the NAS."

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Production promotion"
            echo
            echo "Version: \`${{ steps.release.outputs.version }}\`"
            echo
            echo "Image: \`${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}\`"
            echo
            echo "Source SHA: \`${{ steps.release.outputs.source_sha }}\`"
            echo
            echo "The image was promoted without rebuilding."
          } >> "$GITHUB_STEP_SUMMARY"
